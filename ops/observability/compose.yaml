name: bb-observability

services:
  lgtm:
    image: grafana/otel-lgtm:0.38.1
    restart: unless-stopped
    environment:
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    ports:
      - "127.0.0.1:${BB_LGTM_GRAFANA_PORT:-3000}:3000"
      - "127.0.0.1:${BB_LGTM_OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${BB_LGTM_OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - lgtm-data:/data
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 5s
      timeout: 3s
      retries: 60

volumes:
  lgtm-data:
